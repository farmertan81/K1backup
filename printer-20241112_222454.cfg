[include mainsail.cfg]
[include sensorless.cfg]
#[include gcode_macro.cfg]
#[include KAMP_Settings.cfg]

[exclude_object]

[respond]

[pause_resume]
recover_velocity: 100

[save_variables]
filename:/home/pi/printer_data/config/variables.cfg

[gcode_arcs]
resolution: 0.1

[idle_timeout]
timeout: 99999999

[stepper_x]
step_pin: gpio11
dir_pin: gpio10
enable_pin: !gpio12
microsteps: 64
rotation_distance: 72
#endstop_pin: ^gpio4
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: 229
position_min: -5
position_max: 229
homing_speed: 36

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 1.5
sense_resistor: 0.100
diag_pin: ^gpio4
driver_SGTHRS: 65

[stepper_y]
step_pin: gpio6
dir_pin: gpio5
enable_pin: !gpio7
microsteps: 64
rotation_distance: 72
#endstop_pin: ^gpio3
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: -0.5
position_min: -0.5
position_max: 226
homing_speed: 36

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 1.5
sense_resistor: 0.100
diag_pin: ^gpio3
driver_SGTHRS: 65

[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 8
gear_ratio: 64:20
endstop_pin: probe:z_virtual_endstop
position_min: -50
position_max: 255
homing_speed: 12
homing_retract_dist: 0
second_homing_speed: 1 

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.8

[extruder]
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 80
step_pin: nozzle_mcu:PB1
dir_pin: !nozzle_mcu:PB0
enable_pin: !nozzle_mcu:PB2
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
pressure_advance_smooth_time: 0.02
rotation_distance: 4.680
#control: pid
#pid_Kp: 25.013
#pid_Ki: 2.566
#pid_Kd: 60.966
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
uart_address: 3
sense_resistor: 0.150
run_current: 0.7

[heater_bed]
heater_pin: gpio21
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio26
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 120

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !gpio24
runout_gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G0 E30 F600
    G90
  {% endif %}

[multi_pin heater_fans]
pins:nozzle_mcu:PB5

[heater_fan hotend_fan]
pin: multi_pin:heater_fans
heater: extruder
heater_temp: 40

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio27
min_temp: 0
max_temp: 125

[static_digital_output my_fan_output_pins]
pins: nozzle_mcu: PB6

[duplicate_pin_override]
pins: gpio17,gpio27,nozzle_mcu:PB8

[fan]
#nozzle fan
pin: !nozzle_mcu: PB8
kick_start_time: 0.5
off_below: 0.05

[output_pin nozzle_fan]
#nozzle fan
pin: !nozzle_mcu: PB8
pwm: True
cycle_time: 0.0100
hardware_pwm: false 
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin chamber_fan]
#rear fan
pin: gpio17
pwm: True
cycle_time: 0.0100
hardware_pwm: false  
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin RSCS_fan]
#side fan
pin: gpio18
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[temperature_fan chamber_fan]
#rear fan
pin: gpio17
cycle_time: 0.0100
hardware_pwm: false 
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio27
min_temp: 0
max_temp: 70
control: watermark
max_delta: 2
target_temp: 45
max_speed: 1.0
min_speed: 0.0

[controller_fan stepper_fan]
pin: gpio20
fan_speed: 1
idle_timeout: 15
idle_speed: .4
stepper: stepper_x

[output_pin LED]
pin: gpio23
pwm: true
cycle_time: 0.1

#[resonance_tester]
#accel_chip: adxl345
#accel_per_hz: 75
#probe_points:
 #  110,110,10

[scanner]       
#    adjust to suit your scanner, if using usb change to serial.
serial: /dev/serial/by-id/usb-Cartographer_614e_260003801543303856303820-if00
x_offset: -16                         
#    adjust for your cartographers offset from nozzle to middle of coil
y_offset: 0                        
#    adjust for your cartographers offset from nozzle to middle of coil
backlash_comp: 0.01654
#   Backlash compensation distance for removing Z backlash before measuring
#   the sensor response.
# 
#   Offsets are measured from the centre of your coil, to the tip of your nozzle 
#   on a level axis. It is vital that this is accurate. 
calibration_method: touch
#    leave this as touch unless you want to use scan only for everything. 
sensor: cartographer
#    this must be set as cartographer unless using IDM etc.
sensor_alt: carto
#    alternate name to call commands. CARTO_TOUCH etc
scanner_touch_z_offset: 0.05         
#    This is the default and will be overwritten and added to the DO NOT SAVE area by using UI to save z offset
mesh_runs: 2
#    Number of passes to make during mesh scan.


[bed_mesh]
zero_reference_position: 112,112
speed: 400              # recommended max 150 - absolute max 180. going above 150 will cause mcu hanging / crashing or inconsistant spikey meshes due to bandwidth limitation.  
mesh_min: 10, 10         # up to 30x30 if you have a weird spike bottom left of mesh
mesh_max: 210, 210      # 210 max before hitting rear plate screws on stock bed
probe_count: 64,64      # tested 100x100 working
algorithm: bicubic      # required for above 5x5 meshing
bicubic_tension: 0.01

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor skr_pico]
sensor_type: temperature_mcu

#[temperature_sensor skr_pico]
#sensor_type: temperature_mcu
#min_temp: 0
#max_temp: 100

[mcu nozzle_mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 230400
restart_method: command

[mcu]
serial: /dev/ttyAMA0
restart_method: command

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 20000
#max_accel_to_decel: 20000
square_corner_velocity: 5.0
max_z_velocity: 20
max_z_accel: 300


[include mainsail.cfg]
[include sensorless.cfg]
[include scanner.cfg]
[include start_end.cfg]
[include pa_calibrate.cfg]
[include fan_control.cfg]
[include shaketune.cfg]
[include flowcalibration.cfg]
[include Macros.cfg]
#[include nozzleadxl.cfg]
#[k1adxl.cfg]

[virtual_sdcard]
path: ~/printer_data/gcodes
[display_status]
[exclude_object]
[respond]
[pause_resume]
recover_velocity: 100
[save_variables]
filename:/home/pi/printer_data/config/variables.cfg

[gcode_arcs]
resolution: 0.1

[idle_timeout]
timeout: 99999999

[mcu cm4]
serial: /tmp/klipper_host_mcu

[mcu nozzle_mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 230400
restart_method: command

[mcu]
serial:/dev/serial/by-id/usb-Klipper_stm32g0b1xx_3D00140013504B5735313920-if00


[printer]
kinematics: corexy
max_velocity: 800
max_accel: 16000
square_corner_velocity: 5.0
max_z_velocity: 20
max_z_accel: 300

[stepper_x]
step_pin: PC8
dir_pin: PC9
enable_pin: !PA15
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: 233
position_min: 0
position_max: 233
homing_speed: 36

[tmc2209 stepper_x]
uart_pin: PD9
run_current: 1.6
sense_resistor: 0.110
diag_pin: ^PD3
driver_SGTHRS: 68
interpolate: false

[stepper_y]
step_pin: PA10
dir_pin: PA14
enable_pin: !PA13
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_min: 0
position_max: 221.5
homing_speed: 36

[tmc2209 stepper_y]
uart_pin: PD8
run_current: 1.6
sense_resistor: 0.110
diag_pin: ^PD2
driver_SGTHRS: 68
interpolate: false
###################################################################################################################
[stepper_z] 
step_pin: PC6
dir_pin: !PC7
enable_pin: !PA9
microsteps: 32
rotation_distance: 8
gear_ratio: 20:16
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0			     
position_min: -50
position_max: 255
homing_speed: 100

[tmc2209 stepper_z] 
uart_pin: PB10
interpolate: false
#slow
#run_current: 0.8
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 99999

 ######################################
[stepper_z1]
step_pin: PB12
dir_pin: PB11
enable_pin: !PA8
microsteps: 32
rotation_distance: 8
gear_ratio: 20:16

[tmc2209 stepper_z1]
uart_pin: PB2
interpolate: false
#slow
#run_current: 0.8
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 99999

#####################################

[stepper_z2]
step_pin: PB0
dir_pin: !PB1
enable_pin: !PC4
microsteps: 32
rotation_distance: 8
gear_ratio: 20:16

[tmc2209 stepper_z2]
uart_pin: PA6
interpolate: false
#slow
#run_current: 0.8
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 99999
########################################################################

[z_tilt]
z_positions:
    
    -48, 4              # stepper_z location (front left)
    111.5, 235            # stepper_z1 location (rear center)
    270, 4              # stepper_z2 location (front right)
points:
    52.33, 6             # front left
   140.165, 210        # rear center
    230, 6            # front right
speed: 200
horizontal_move_z: 15
retries: 5
retry_tolerance: 0.0075

[extruder]
max_extrude_only_distance: 101
max_extrude_cross_section: 80
step_pin: nozzle_mcu:PB1
dir_pin: !nozzle_mcu:PB0
enable_pin: !nozzle_mcu:PB2
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB7
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.038
pressure_advance_smooth_time: 0.02
rotation_distance: 4.637
#control: pid
#pid_Kp: 25.013
#pid_Ki: 2.566
#pid_Kd: 60.966
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
uart_address: 3
sense_resistor: 0.110
run_current: 0.85

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
max_power: 0.8
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 120

#[filament_switch_sensor filament_sensor]
#pause_on_runout: true
#switch_pin: !gpio24
#runout_gcode:
#  {% if printer.extruder.can_extrude|lower == 'true' %}
#    G91
#    G0 E30 F600
#    G90
#  {% endif %}
###########################################################################################################################

[output_pin LED]
pin: PC5
pwm: true
cycle_time: 0.1
value:1

[adxl345]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,-y,z
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: adxl345
probe_points:
   117.5, 117.5, 20

#[lis2dw]
#cs_pin: scanner:PA3
#spi_bus: spi1

#[resonance_tester]
#accel_chip: lis2dw
#probe_points: 117.5, 117.5, 20
   

[input_shaper]
shaper_freq_x:  70.2 # center frequency for the X axis filter
shaper_type_x: mzv  # filter type for the X axis
shaper_freq_y: 61.4 # center frequency for the Y axis filter
shaper_type_y: mzv  # filter type for the Y axis
damping_ratio_x: 0.071 # damping ratio for the X axis
damping_ratio_y: 0.039 # damping ratio for the Y axis


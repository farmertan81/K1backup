[include mainsail.cfg]
[include sensorless.cfg]
[include scanner.cfg]
[include Bed_mesh.cfg]
#[include gcode_macro.cfg]
#[include KAMP_Settings.cfg]

[virtual_sdcard]
path: ~/printer_data/gcodes
[display_status]
[exclude_object]
[respond]
[pause_resume]
recover_velocity: 100
[save_variables]
filename:/home/pi/printer_data/config/variables.cfg

[gcode_arcs]
resolution: 0.1

[idle_timeout]
timeout: 99999999

[mcu nozzle_mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 230400
restart_method: command

[mcu]
serial: /dev/ttyAMA0
restart_method: command

[mcu micro4]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E662608797118F2A-if00

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 20000
square_corner_velocity: 5.0
max_z_velocity: 20
max_z_accel: 300

[stepper_x]
step_pin: gpio11
dir_pin: gpio10
enable_pin: !gpio12
microsteps: 64
rotation_distance: 72
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: 229
position_min: -5
position_max: 229
homing_speed: 36

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 1.5
sense_resistor: 0.100
diag_pin: ^gpio4
driver_SGTHRS: 65

[stepper_y]
step_pin: gpio6
dir_pin: gpio5
enable_pin: !gpio7
microsteps: 64
rotation_distance: 72
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: -0.5
position_min: -0.5
position_max: 226
homing_speed: 36

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 1.5
sense_resistor: 0.100
diag_pin: ^gpio3
driver_SGTHRS: 65
###################################################################################################################

[stepper_z] 
step_pin: micro4: gpio1
dir_pin: !micro4: gpio0
enable_pin: !micro4: gpio2
microsteps: 32
rotation_distance: 8
gear_ratio: 20:16
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0			     
position_min: -50
position_max: 255
homing_speed: 100

[tmc2209 stepper_z] 
uart_pin: micro4: gpio9
uart_address: 1
interpolate: false
#slow
run_current: 0.8
#run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 99999

 ######################################
[stepper_z1]
step_pin: micro4: gpio6
dir_pin: micro4: gpio3
enable_pin: !micro4: gpio7
microsteps: 32
rotation_distance: 8
gear_ratio: 20:16

[tmc2209 stepper_z1]
uart_pin: micro4: gpio9
uart_address: 0
interpolate: false
#slow
run_current: 0.8
#run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 99999

#####################################

[stepper_z2]
step_pin: micro4: gpio26
dir_pin: !micro4: gpio25
enable_pin: !micro4: gpio27
microsteps: 32
rotation_distance: 8
gear_ratio: 20:16

[tmc2209 stepper_z2]
uart_pin: micro4: gpio9
uart_address: 2
interpolate: false
#slow
run_current: 0.8
#run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 99999
########################################################################

[z_tilt]
z_positions:
    
    -50, 4              # stepper_z location (front left)
    107.5, 238            # stepper_z1 location (rear center)
    270, 4              # stepper_z2 location (front right)
points:
    20, 4             # front left
    107.5, 180        # rear center
    200, 4            # front right
speed: 200
horizontal_move_z: 15
retries: 5
retry_tolerance: 0.0075

#[stepper_z]
#step_pin: gpio19
#dir_pin: gpio28
#enable_pin: !gpio2
#microsteps: 16
#rotation_distance: 8
#gear_ratio: 64:20
#endstop_pin: probe:z_virtual_endstop
#position_min: -50
#position_max: 255
#homing_speed: 12
#homing_retract_dist: 0
#second_homing_speed: 1 

#[tmc2209 stepper_z]
#uart_pin: gpio9
#tx_pin: gpio8
#uart_address: 1
#run_current: 0.8

[extruder]
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 80
step_pin: nozzle_mcu:PB1
dir_pin: nozzle_mcu:PB0
enable_pin: !nozzle_mcu:PB2
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
pressure_advance_smooth_time: 0.02
rotation_distance: 6.770
#control: pid
#pid_Kp: 25.013
#pid_Ki: 2.566
#pid_Kd: 60.966
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
uart_address: 3
sense_resistor: 0.150
run_current: 0.7

[heater_bed]
heater_pin: gpio21
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio26
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 120

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !gpio24
runout_gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G0 E30 F600
    G90
  {% endif %}

[multi_pin heater_fans]
pins:nozzle_mcu:PB5

[heater_fan hotend_fan]
pin: multi_pin:heater_fans
heater: extruder
heater_temp: 40

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio27
min_temp: 0
max_temp: 125

[static_digital_output my_fan_output_pins]
pins: nozzle_mcu: PB6

[duplicate_pin_override]
pins: gpio17,gpio27,nozzle_mcu:PB8

#[fan]
#nozzle fan
#pin: !nozzle_mcu: PB8
#kick_start_time: 0.5
#off_below: 0.05

[output_pin nozzle_fan]
#nozzle fan
pin: !nozzle_mcu: PB8
pwm: True
cycle_time: 0.0100
hardware_pwm: false 
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin chamber_fan]
#rear fan
pin: gpio17
pwm: True
cycle_time: 0.0100
hardware_pwm: false  
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin RSCS_fan]
#side fan
pin: gpio18
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[temperature_fan chamber_fan]
#rear fan
pin: gpio17
cycle_time: 0.0100
hardware_pwm: false 
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio27
min_temp: 0
max_temp: 70
control: watermark
max_delta: 2
target_temp: 45
max_speed: 1.0
min_speed: 0.0

[controller_fan stepper_fan]
pin: gpio20
fan_speed: 1
idle_timeout: 15
idle_speed: .4
stepper: stepper_x

[output_pin LED]
pin: gpio23
pwm: true
cycle_time: 0.1
value:1

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor skr_pico]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor micro4]      
sensor_type: temperature_mcu
sensor_mcu: micro4
min_temp: 0
max_temp: 100



#probe_points: 117.5, 117.5, 20
   

[input_shaper]
shaper_freq_x:  66.2 # center frequency for the X axis filter
shaper_type_x: mzv  # filter type for the X axis
shaper_freq_y: 57.6 # center frequency for the Y axis filter
shaper_type_y: mzv  # filter type for the Y axis
damping_ratio_x: 0.030 # damping ratio for the X axis
damping_ratio_y: 0.066 # damping ratio for the Y axis


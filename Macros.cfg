[gcode_macro LOAD_MATERIAL]
variable_beep: False
variable_extruder_temp: 265
variable_extrude_len: 100
gcode:
  {% set extruder_temp = params.EXTRUDER_TEMP|default(extruder_temp)|int %}
  {% set extrude_len = params.EXTRUDE_LEN|default(extrude_len)|int %}
  RESPOND TYPE=command MSG='Waiting for nozzle temp to reach {extruder_temp}c'
  M109 S{extruder_temp}
  G91
  G1 E{extrude_len} F180
  M400
  {% if beep %}
    BEEP
  {% endif %}

# this macro is used by guppyscreen as well
[gcode_macro UNLOAD_MATERIAL]
variable_beep: False
variable_extruder_temp: 265
gcode:
  {% set extruder_temp = params.EXTRUDER_TEMP|default(extruder_temp)|int %}
  SAVE_GCODE_STATE NAME=myMoveState
  RESPOND TYPE=command MSG='Waiting for nozzle temp to reach {extruder_temp}c'
  M109 S{extruder_temp}
  G91
  G1 E20 F180
  G1 E-30 F180
  G1 E-50 F2000
  M400
  RESTORE_GCODE_STATE NAME=myMoveState
  {% if beep %}
    BEEP
  {% endif %}

[gcode_macro LOAD_PLA]
gcode:
  LOAD_MATERIAL EXTRUDER_TEMP=210

[gcode_macro LOAD_PETG]
gcode:
  LOAD_MATERIAL EXTRUDER_TEMP=240

[gcode_macro LOAD_ASA_ABS]
gcode:
  LOAD_MATERIAL EXTRUDER_TEMP=250

[gcode_macro UNLOAD_PLA]
gcode:
  UNLOAD_MATERIAL EXTRUDER_TEMP=210

[gcode_macro UNLOAD_PETG]
gcode:
  UNLOAD_MATERIAL EXTRUDER_TEMP=240

[gcode_macro UNLOAD_ASA_ABS]
gcode:
  UNLOAD_MATERIAL EXTRUDER_TEMP=250
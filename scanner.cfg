[scanner]       

serial: /dev/serial/by-id/usb-Cartographer_614e_260003801543303856303820-if00
x_offset: -18.665                         
y_offset: 0                        
backlash_comp: 0.00042
sensor: cartographer
sensor_alt: carto
mesh_runs: 2

[bed_mesh]
zero_reference_position: 112,112
speed: 400              # recommended max 150 - absolute max 180. going above 150 will cause mcu hanging / crashing or inconsistant spikey meshes due to bandwidth limitation.  
mesh_min: 15, 15         # up to 30x30 if you have a weird spike bottom left of mesh
mesh_max: 210, 210      # 210 max before hitting rear plate screws on stock bed
probe_count: 64,64      # tested 100x100 working
algorithm: bicubic      # required for above 5x5 meshing
bicubic_tension: 0.01

[include mainsail.cfg]
[include sensorless.cfg]
[include scanner.cfg]
#[include print_start.cfg]
[include start_end.cfg]
[include pa_calibrate.cfg]
[include fan_control.cfg]

[virtual_sdcard]
path: ~/printer_data/gcodes
[display_status]
[exclude_object]
[respond]
[pause_resume]
recover_velocity: 100
[save_variables]
filename:/home/pi/printer_data/config/variables.cfg

[gcode_arcs]
resolution: 0.1

[idle_timeout]
timeout: 99999999

[mcu nozzle_mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 230400
restart_method: command

[mcu]
serial: /dev/ttyAMA0
restart_method: command

[mcu micro4]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E662608797118F2A-if00

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 20000
square_corner_velocity: 5.0
max_z_velocity: 20
max_z_accel: 300

[stepper_x]
step_pin: gpio11
dir_pin: gpio10
enable_pin: !gpio12
microsteps: 64
rotation_distance: 72
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: 232
position_min: -5
position_max: 232
homing_speed: 36

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 1.5
sense_resistor: 0.100
diag_pin: ^gpio4
driver_SGTHRS: 65

[stepper_y]
step_pin: gpio6
dir_pin: gpio5
enable_pin: !gpio7
microsteps: 64
rotation_distance: 72
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: -0.5
position_min: -0.5
position_max: 226
homing_speed: 36

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 1.5
sense_resistor: 0.100
diag_pin: ^gpio3
driver_SGTHRS: 65
###################################################################################################################
[stepper_z] 
step_pin: micro4: gpio1
dir_pin: !micro4: gpio0
enable_pin: !micro4: gpio2
microsteps: 32
rotation_distance: 8
gear_ratio: 20:16
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0			     
position_min: -50
position_max: 255
homing_speed: 100

[tmc2209 stepper_z] 
uart_pin: micro4: gpio9
uart_address: 1
interpolate: false
#slow
run_current: 0.8
#run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 99999

 ######################################
[stepper_z1]
step_pin: micro4: gpio6
dir_pin: micro4: gpio3
enable_pin: !micro4: gpio7
microsteps: 32
rotation_distance: 8
gear_ratio: 20:16

[tmc2209 stepper_z1]
uart_pin: micro4: gpio9
uart_address: 0
interpolate: false
#slow
run_current: 0.8
#run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 99999

#####################################

[stepper_z2]
step_pin: micro4: gpio26
dir_pin: !micro4: gpio25
enable_pin: !micro4: gpio27
microsteps: 32
rotation_distance: 8
gear_ratio: 20:16

[tmc2209 stepper_z2]
uart_pin: micro4: gpio9
uart_address: 2
interpolate: false
#slow
run_current: 0.8
#run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 99999
########################################################################

[z_tilt]
z_positions:
    
    -48, 4              # stepper_z location (front left)
    111.5, 235            # stepper_z1 location (rear center)
    270, 4              # stepper_z2 location (front right)
points:
    25, 6             # front left
    127.5, 210        # rear center
    230, 6            # front right
speed: 200
horizontal_move_z: 15
retries: 5
retry_tolerance: 0.0075

[extruder]
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 80
step_pin: nozzle_mcu:PB1
dir_pin: nozzle_mcu:PB0
enable_pin: !nozzle_mcu:PB2
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.08
pressure_advance_smooth_time: 0.02
rotation_distance: 6.770
#control: pid
#pid_Kp: 25.013
#pid_Ki: 2.566
#pid_Kd: 60.966
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
uart_address: 3
sense_resistor: 0.150
run_current: 0.7

[heater_bed]
heater_pin: gpio21
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio26
max_power: 0.8
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 120

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !gpio24
runout_gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G0 E30 F600
    G90
  {% endif %}
###########################################################################################################################

[output_pin LED]
pin: gpio23
pwm: true
cycle_time: 0.1
value:1
